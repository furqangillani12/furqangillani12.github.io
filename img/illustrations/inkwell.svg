<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><rect width="1600" height="900" fill="#F6EFE6"/><rect x="0" y="0" width="1600" height="900" rx="0" fill="#F6EFE6"/><rect x="0" y="0" width="1600" height="72" rx="0" fill="#2A0F1D"/><text x="40" y="45" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FAEEF1" text-anchor="start" font-style="italic">Inkwell</text><text x="1150" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#D4B5C1" text-anchor="start">Read</text><text x="1270" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#D4B5C1" text-anchor="start">Write</text><text x="1390" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#D4B5C1" text-anchor="start">Journal</text><rect x="80" y="130" width="820" height="640" rx="18" fill="#FFFDF8" stroke="#E8DCCB" stroke-width="2"/><text x="130" y="210" font-family="Georgia, serif" font-size="40" font-weight="400" fill="#2A0F1D" text-anchor="start" font-style="italic">Dear younger me,</text><rect x="130" y="270" width="620" height="12" rx="6.0" fill="#E6D9C6"/><rect x="130" y="316" width="690" height="12" rx="6.0" fill="#E6D9C6"/><rect x="130" y="362" width="560" height="12" rx="6.0" fill="#E6D9C6"/><rect x="130" y="408" width="650" height="12" rx="6.0" fill="#E6D9C6"/><rect x="130" y="454" width="600" height="12" rx="6.0" fill="#E6D9C6"/><rect x="130" y="500" width="420" height="12" rx="6.0" fill="#E6D9C6"/><text x="850" y="610" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#8C6A57" text-anchor="end" font-style="italic">Anonymous</text><rect x="130" y="690" width="72" height="28" rx="14.0" fill="#FDE0E9"/><text x="142" y="707" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#8C3A5A" text-anchor="start">Family</text><rect x="214" y="